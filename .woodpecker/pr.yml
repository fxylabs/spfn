# primitives CI — the gate a pull request has to pass.
#
# Until this file existed the repository had no pull-request check at all. Two
# workflows on the GitHub side declare `pull_request` triggers, but pull requests
# live on Gitea and GitHub is only a mirror, so those triggers never fire — they
# run on the main push instead, which is to say after merge. They report; they
# do not gate.
#
# What that cost: examples/01-minimal-api sat in main unable to boot (issue #119)
# while every package test passed, because nothing ever ran an example. `next
# build` compiles the frontend and never touches the SPFN server. The smoke step
# below is that missing run, and it found a second defect — a production build
# silently dropping the app's entire server.config — on its first execution.
#
# Two steps, not one, because the second needs services and the first must not
# wait for them: a lint error should report in a minute rather than after a full
# suite. Steps share the workspace volume, so `dist/` built in `verify` is still
# there in `test`.
#
# Measured on a developer machine with turbo's cache disabled, which is the state
# a fresh checkout is always in: build 59s, lint 6s, type-check 46s, the two
# checks 1s, the smoke 4s, the suite 198s. The `spfn dev` smoke in `test` adds
# about 20s.
#
# A pull request builds, type-checks and tests only the packages it changes and
# everything that depends on them. Pipeline 521 changed one line — the `version`
# of packages/i18n/package.json — and took 33.7 minutes: `verify` 986s (18 builds,
# none cached, 8m22s; type-check 2m17s) and `test` 1038s (20 test tasks, 16m16s).
# i18n's own tests take 4.7s and nothing in the workspace depends on @spfn/i18n.
#
# The scope comes from `CI_PIPELINE_FILES`, the changed-file list Woodpecker
# hands the pipeline, and not from a git diff: the clone fetches the pull
# request's commit alone (`--depth=1`) from a private repository and no later
# step has credentials, so there is no `origin/main` to diff against. The rule
# is in scripts/lib/ci-scope.mjs and its tests; in short, any changed path
# outside packages/<d>/, examples/<d>/ and website/ — the lockfile, a root
# tsconfig, this file, scripts/ — runs everything, because it can change how
# anything builds. So does a list Woodpecker leaves out (it does past 500 files).
#
# A main push runs this same workflow only when it changes a package manifest
# (`packages/*/package.json`), because that is the push that publishes. There
# it runs all of it: main is where the whole tree has to be known good before
# anything goes to the registry, and a scoped pull request only proved its own
# corner. That run gates the publish: publish.yml declares `depends_on: [pr]`,
# so the Gitea publish of the same pipeline starts only after this workflow
# succeeded and does not run when it fails. A feature merge changes no
# manifest and runs nothing: its pull request was already checked, and the
# next release's main run checks the whole tree before it publishes. What that
# gives up: a feature merge whose pull-request CI ran before main moved under
# it is first checked as a whole at the next release, not at its merge.
#
# A pull request that changes only package manifests — a release PR — runs
# nothing either. Its merge is a main push that changes a manifest, and that
# push runs the full check before the publish; running the scoped check first
# would build and test the same packages twice for one release. Pipeline 521
# above was such a run. The cost is that a manifest-only change which is
# not a version bump (an `exports` edit, say) is checked at its merge, not in
# its pull request.
#
# The glob is `packages/*/package.json`: `*` does not cross a `/`, and an
# example's or the website's manifest is not a release.
#
# The manual entry exists for that dependency. Woodpecker (3.17.0) drops a
# workflow whose required `depends_on` names a workflow that did not match the
# event (`filterMissingDependencies` in pipeline/frontend/builder/utils.go), so
# without it a manual run on main — the publish backfill — would start nothing
# at all. It is limited to main so that a manual run on any other branch does
# not start the full check. It carries no path condition: a manual run has no
# changed-file list.
when:
    - event: pull_request
      path:
          exclude: ['packages/*/package.json']
    - event: push
      branch: main
      path:
          include: ['packages/*/package.json']
    - event: manual
      branch: main

steps:
    verify:
        image: node:22
        # Without this block a step pod carries no resource request at all, which
        # in Kubernetes is BestEffort: last in line for CPU under contention and
        # first to be killed when the node runs short of memory. Both failure
        # modes were observed on the same commit — one run had the website's
        # static export time out page after page at its 60s limit, the next died
        # mid-build with no error written at all. The same build takes 28s on a
        # laptop. Nothing about the code was slow; the pod was simply not asking
        # for anything.
        #
        # `role: build` is the dedicated build pool. As read from the cluster on
        # 2026-11-20: GKE Autopilot, its nodes `gk3-…` of machine type
        # `ek-standard-8`, amd64. It is tainted, so the toleration is required
        # alongside the selector — a selector on its own leaves the pod
        # unschedulable.
        #
        # `ephemeral-storage` is everything the container writes outside the
        # workspace volume: its own filesystem layer, /tmp, its log. Undeclared,
        # GKE Autopilot gives a pod 1Gi and evicts it past that — the namespace
        # `woodpecker` has no LimitRange (read 2026-11-20), so the 1Gi is
        # Autopilot's — and pipelines
        # 729, 735, 740, 741 and 743 ended so — exit 137, the log cut inside
        # @spfn/auth's tests, `Evicted: Pod ephemeral local storage usage exceeds
        # the total limit of containers 1Gi.` Measured in 743's `test` pod just
        # before the eviction:
        #
        #     /usr                 276 MB  growth from the step's apt-get install,
        #                                  /usr/local/bin/sops included
        #     /root                322 MB  21 until the cli suite ran
        #     /var/lib/postgresql  282 MB  pg_wal 209 of it, and growing
        #     /tmp                  79 MB  the 46 MB sops download included
        #
        # The rule since: a large or growing write goes on the workspace volume
        # (a PersistentVolumeClaim, not counted here), not in the container.
        # `test` below follows it for the cluster and its home directory.
        # Measured in 746, this branch's `test` (head f834ed48, every task
        # passed), with `du` in the pod every 120 s through the step; the peak
        # of each:
        #
        #     container  /usr                 276 MB  above the image's 1085, as in 743
        #                /tmp                  33 MB
        #                /root                  1 MB
        #                /var/lib/postgresql    1 MB  after the drop
        #                /var/log               1 MB
        #     volume     postgresql           107 MB  the whole cluster, pg_wal in it
        #                home                 151 MB  all of it corepack's pnpm
        #                redis                  1 MB
        #
        # The container's writes peaked at about 310 MB, so 2Gi leaves about
        # 1.8 GB for what the rows do not show — the step log, a new suite's
        # temporary files, a larger apt dependency.
        # `verify` writes less: no apt, no cluster; pnpm keeps its store at the
        # volume's root because /root is another filesystem, so the one-off
        # corepack pnpm (21 MB) and the build's /tmp are its share. 744's
        # `verify` pod carried the 2Gi as request and limit (read 2026-11-20).
        # 2Gi is a fifth of Autopilot's 10Gi maximum, and Autopilot requires the
        # limit to equal the request.
        backend_options: &build_pod
            kubernetes:
                resources:
                    requests:
                        cpu: "2"
                        memory: "4Gi"
                        ephemeral-storage: "2Gi"
                    limits:
                        cpu: "4"
                        memory: "7Gi"
                        ephemeral-storage: "2Gi"
                nodeSelector:
                    role: build
                tolerations:
                    - key: "role"
                      operator: "Equal"
                      value: "build"
                      effect: "NoSchedule"
        commands:
            - corepack enable
            - pnpm install --frozen-lockfile

            # An example's `next build` collects page data, which validates the
            # environment, and `SPFN_API_URL` is required there. It comes from
            # `.env.local`, which is gitignored — so without this the build fails
            # at 01-minimal-api, turbo cancels the rest, @spfn/auth never
            # produces dist/, and 34 of its test files fail on a missing
            # self-import. Seeding from the committed template is also the check
            # that the template is complete, since it is what an adopter follows.
            - pnpm setup:examples

            # The scope, as turbo filters: one `--filter=...<name>` per changed
            # package (the package and everything depending on it), or nothing
            # at all for a full run. Steps run their commands as one shell
            # script — `SOPS_VERSION` and `PGVER` in `test` rely on the same —
            # so the variable reaches the commands below. Unquoted there on
            # purpose: several filters are several arguments, and an empty value
            # is no argument rather than an empty one. The decision line goes to
            # the log on stderr.
            - FILTERS="$(node scripts/ci-scope.mjs filters)"

            # Build first: several checks import @spfn/core subpaths whose
            # exports point at dist/, and a fresh checkout has none.
            #
            # The scope's packages alone, at 1024MB: one needing more fails here, cause named — #352,
            # one declaration program per tsup config, hungriest package measured 448MB — rather
            # than as an unexplained DTS worker out-of-memory near 3072MB in the next line.
            # ERR_WORKER_OUT_OF_MEMORY here most likely means patches/tsup@9.0.0.patch was
            # dropped or not applied (a tsup bump without it, or a stale install): without it
            # tsup builds one declaration program per entry directory again.
            - NODE_OPTIONS=--max-old-space-size=1024 pnpm exec turbo run build --concurrency=2 $FILTERS --filter='!./examples/*' --filter='!./website'

            # Everything in scope; the packages come from turbo's cache.
            #
            # Not the bare `pnpm build`, and the two flags are not tuning. Once
            # the pod has a memory *limit*, every Node process inside it sizes
            # its heap against that one number — so turbo's default fan-out puts
            # several builds in the ring each believing it may use most of 7Gi.
            # @spfn/core's declaration build was the one that lost: its tsup DTS
            # worker built a TypeScript program per entry directory (#352) and
            # died with ERR_WORKER_OUT_OF_MEMORY while the website and three
            # example builds ran beside it. Two at a time in a pod limited to 4
            # CPUs, each capped at 3GB, keeps the sum under the limit with room
            # for the toolchain itself.
            #
            # `pnpm exec turbo run`, not `pnpm build --filter=…`: pnpm reads a
            # `--filter` before the script name as its own option.
            - NODE_OPTIONS=--max-old-space-size=3072 pnpm exec turbo run build --concurrency=2 $FILTERS

            # Lint is formatting only and reads no build output; the two checks
            # read package.json files and prose. None of them needs a build, so
            # they stay whole-repo — 7s together, against minutes for a build.
            - pnpm lint
            - pnpm exec turbo run type-check $FILTERS
            - pnpm check:versions
            - pnpm check:exports

            # Each source module once per package (#398), checked on every built
            # package's dist as it stands: each package's `build` runs the same
            # check, but what a build script runs is its own text, and a later
            # step (a `postbuild`, a second script) could bundle after it. This
            # reads the output whatever produced it. A package the scope did not
            # build has no dist and is named as skipped.
            - pnpm check:bundles

            # The publish order, checked without a registry. `publish-changed.mjs`
            # decides what goes out and in what order, and a registry version is
            # immutable — so the one place that logic can be wrong for free is
            # here, on a pull request, rather than on a main push that publishes.
            - pnpm test:scripts

            # Boot examples/01-minimal-api and check it answers what its README
            # promises. It needs no database, no cache and no secrets, which is
            # what lets it run before the services are up.
            #
            # Only when the scope includes the example — a full run, or a change
            # to it or to anything it depends on (@spfn/core brings it in). Any
            # other scope did not build it, and booting a missing build would
            # fail for a reason the change has nothing to do with. Exit 1 means
            # "not in scope"; anything else from the check is the check failing,
            # and fails the step.
            - |
                IN_SCOPE=0
                node scripts/ci-scope.mjs includes 01-minimal-api || IN_SCOPE=$?
                case "$IN_SCOPE" in
                    0) node scripts/smoke-example-01.mjs ;;
                    1) echo "smoke-example-01: skipped, 01-minimal-api is outside this pull request's scope" ;;
                    *) exit "$IN_SCOPE" ;;
                esac

    test:
        image: node:22
        # Same pod shape as `verify`. This step needs the memory just as much:
        # it runs PostgreSQL and four Redis instances beside the suite, all inside
        # the pod, so a BestEffort pod would be killed with the databases counted
        # against it.
        backend_options: *build_pod
        commands:
            # PostgreSQL and Redis live inside this step's own container rather
            # than in Woodpecker `services`, and the reason is in the tests: the
            # cache suite hardcodes redis://localhost:6479 through :6482 with no
            # environment override, so a service container — which gets its own
            # hostname — is unreachable from them. Keeping everything on
            # localhost also lets CI call scripts/test-services.sh unchanged,
            # which is what stops the local shape and the CI recipe from
            # drifting apart.
            #
            # Four Redis instances, not one: :6479 plain, :6480 → :6481 a
            # replication pair the cache tests need as a pair, :6482
            # password-protected. The script waits for the replication link
            # rather than for both ports to listen — a per-port health check
            # passes while the replica is still catching up.
            #
            # Nothing reads the package lists or the downloaded archives after
            # the install, and both sit in the container's own storage (see
            # `ephemeral-storage` above), so they go at once.
            - apt-get update
            - apt-get install -y --no-install-recommends postgresql postgresql-contrib redis-server age
            - apt-get clean
            - rm -rf /var/lib/apt/lists/*

            # `age` and `sops` are for the CLI's secret tests
            # (packages/cli/src/commands/secret/__tests__/export.test.ts and
            # set-stdin.test.ts, added in #120), which run the real binaries:
            # `age-keygen` to make a key, `sops` to encrypt and decrypt with it.
            # node:22 is Debian bookworm and carries neither, so since #120 every
            # pipeline failed there with `age-keygen ENOENT` — and turbo stopped
            # at that failure, so auth, cms and monitor never ran at all.
            #
            # bookworm's `age` package ships `age-keygen`. sops has no Debian
            # package, and the CLI needs 3.10 or later, so it is a release binary
            # — pinned, because "latest" would change what CI runs without a
            # commit, and checked against the digest from that release's
            # published checksums file, because the binary decrypts secrets and
            # an HTTP error page saved under its name must stop the step here
            # rather than as a confusing test failure later.
            #
            # The architecture is read from the container, not written down: the
            # build pool is amd64 (read from the cluster on 2026-11-20), but the
            # pod asks for a `role: build` node, not an architecture, so a pool
            # moved to arm64 would otherwise get a binary that fails only as
            # `Exec format error`. dpkg's names and sops' asset names agree for
            # the two architectures pinned; anything else stops the step.
            #
            # The download is deleted once installed: left in /tmp it is a
            # second 46 MB copy in the container's storage.
            - SOPS_VERSION=v3.13.3
            - |
                case "$(dpkg --print-architecture)" in
                    amd64) SOPS_ARCH=amd64; SOPS_SHA256=e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b ;;
                    arm64) SOPS_ARCH=arm64; SOPS_SHA256=53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77 ;;
                    *) echo "no pinned sops binary for $(dpkg --print-architecture)" >&2; exit 1 ;;
                esac
            - curl --fail --silent --show-error --location --output /tmp/sops "https://github.com/getsops/sops/releases/download/$SOPS_VERSION/sops-$SOPS_VERSION.linux.$SOPS_ARCH"
            - echo "$SOPS_SHA256  /tmp/sops" | sha256sum --check --strict
            - install -m 0755 /tmp/sops /usr/local/bin/sops
            - rm /tmp/sops
            - sops --disable-version-check --version
            - age --version

            # The step's large and growing writes go on the workspace volume —
            # the rule and the measurement are with `ephemeral-storage` above —
            # in a directory beside the checkout rather than inside it. Woodpecker
            # mounts the volume at the workspace base (/woodpecker) and checks
            # out at src/<forge host>/<owner>/<repo> beneath it, so the
            # checkout's parent is on the volume while git, eslint, turbo and
            # ci-scope, which all walk the checkout, never see the directory and
            # nothing has to ignore it.
            #
            # `$CI_WORKSPACE` unbraced, as this file writes every variable the
            # shell is to expand. Woodpecker pre-processes a dollar sign followed
            # by a brace in the YAML itself, before any shell runs, with the
            # variables of its `compile` scope only; CI_WORKSPACE is `runtime`
            # scope, so the braced form became empty — 744 ran `dirname ""` and put the state in a
            # relative ./ci-test-state inside the checkout, where Redis, which
            # changes directory, could not open its log. The checks stop the
            # step unless the path is absolute (an empty or relative
            # CI_WORKSPACE yields one that is not), lies outside the checkout,
            # and has its parent on the checkout's device. That parent is no
            # longer the checkout itself, so the device check now proves the
            # directory is on the volume, not on the container's own filesystem
            # as it would be should a `workspace:` put the checkout at the
            # volume's root. The directory is emptied first, so a volume that
            # outlived an earlier run cannot hand pg_createcluster a directory
            # with a cluster in it.
            - STEP_STATE="$(dirname "$CI_WORKSPACE")/ci-test-state"
            - |
                case "$STEP_STATE" in
                    /*) ;;
                    *) echo "$STEP_STATE is not an absolute path" >&2; exit 1 ;;
                esac
                case "$STEP_STATE/" in
                    "$CI_WORKSPACE"/*) echo "$STEP_STATE is inside the checkout $CI_WORKSPACE" >&2; exit 1 ;;
                esac
                if [ "$(stat -c %d "$(dirname "$STEP_STATE")")" != "$(stat -c %d "$CI_WORKSPACE")" ]
                then
                    echo "$(dirname "$STEP_STATE") is not on the checkout's device, the workspace volume" >&2
                    exit 1
                fi
            - rm -rf "$STEP_STATE"
            - mkdir -p "$STEP_STATE"

            # `pg_ctlcluster` rather than `service postgresql start`: it comes
            # from postgresql-common itself, so it does not depend on the image
            # carrying a sysvinit `service` wrapper. The version is read from
            # disk because it follows whatever Debian ships.
            #
            # pg_hba is rewritten to `trust` because this container is thrown
            # away at the end of the step. Trust means the server does not check
            # a password, and a client that sends one anyway still connects — so
            # the roles scripts/test-services.sh creates keep working unchanged
            # and nothing has to juggle a superuser password.
            #
            # Durability is switched off for the same reason: nothing in this
            # cluster outlives the step, so a commit has nothing to wait for. And
            # the suite commits constantly — every @spfn/auth test truncates the
            # schema and reseeds it before it runs. Measured against a throwaway
            # cluster with the Debian defaults, then with these three lines:
            # device-auth.test.ts 72s → 38s, mfa-verify.test.ts 57s → 48s. The core
            # and cms suites share the cluster and get the same settings, which
            # changes nothing they assert. Appended rather than edited in place:
            # the last setting in the file wins.
            #
            # The data directory is on the volume. The package's install makes a
            # cluster under /var/lib/postgresql, in the container's storage,
            # where 743's grew to 282 MB; it is dropped and made again with
            # postgresql-common's own pg_createcluster, which creates the
            # directory owned by `postgres` — the step runs as root — and writes
            # its `data_directory` into the configuration pg_ctlcluster reads.
            # `-p 5432` because that is the port the suites and the roles script
            # use, and pg_createcluster would otherwise take the first free one.
            #
            # The WAL is kept small as well. With Debian's defaults pg_wal grows
            # toward max_wal_size = 1GB before a checkpoint recycles it, and the
            # auth suite rewrites its schema for every test. `wal_level =
            # minimal` logs only what crash recovery needs, and PostgreSQL
            # refuses to start with it unless `max_wal_senders = 0`. It is not
            # silence: a table created or truncated in the transaction that
            # fills it is still logged whole at commit when smaller than
            # `wal_skip_threshold` (2MB), as the suites' tables are; only
            # larger ones skip the WAL. Nothing in the repository replicates,
            # decodes logically or publishes; pg_trgm, LISTEN/NOTIFY and pg_dump
            # all work at that level. `max_wal_size = 32MB` is PostgreSQL's
            # floor, two 16 MB segments, and a soft limit: it triggers a
            # checkpoint, and pg_wal outgrows it until that checkpoint ends.
            # `min_wal_size`, the same, is how much finished WAL is kept for
            # reuse rather than removed. `checkpoint_timeout = 30s` is its floor
            # too, for stretches too quiet to reach the size. Measured against a
            # throwaway cluster with a truncate, reseed and update loop: pg_wal
            # 689 MB with the Debian defaults; a 49 MB peak, 33 MB afterwards,
            # with these lines. In 746 the whole cluster peaked at 107 MB, pg_wal
            # included. What the more frequent checkpoints cost the suites in
            # time was not measured.
            - PGVER=$(ls /etc/postgresql | head -n1)
            - pg_dropcluster --stop "$PGVER" main
            - pg_createcluster -p 5432 -d "$STEP_STATE/postgresql" "$PGVER" main
            - printf '%s\n' 'local all all trust' 'host all all 127.0.0.1/32 trust' > "/etc/postgresql/$PGVER/main/pg_hba.conf"
            - printf '%s\n' 'fsync = off' 'synchronous_commit = off' 'full_page_writes = off' 'wal_level = minimal' 'max_wal_senders = 0' 'max_wal_size = 32MB' 'min_wal_size = 32MB' 'checkpoint_timeout = 30s' >> "/etc/postgresql/$PGVER/main/postgresql.conf"
            - pg_ctlcluster "$PGVER" main start

            # The Redis instances' state and logs follow, through the script's
            # own variable for them.
            - PGUSER=postgres SPFN_TEST_STATE_DIR="$STEP_STATE/redis" ./scripts/test-services.sh start

            # The home directory moves to the volume for the rest of the step,
            # before corepack first writes to it. What is known of the 322 MB
            # 743's /root held: run with a fresh HOME on a developer machine,
            # the cli suite left 152 MB there, 151 of them corepack's downloads —
            # pnpm 9.1.2 for the repository (21 MB, the 21 MB measured before the
            # suite), 10.34.5 (23) and 11.23.0 (40) that
            # test/kit/local-install-integration.test.ts runs, and the newest pnpm
            # (68 MB as 12.21.0), fetched when the kit runs pnpm in a scratch
            # project that names no `packageManager`. What is not known: the
            # other 170 MB, which that run did not write, nor did 745 or 746;
            # wherever it comes from, it would now land on the volume. A tool's
            # own variable would not cover even the known part — the kit hands its pnpm
            # children HOME but not COREPACK_HOME (packages/cli/src/kit/
            # child-env.ts), so they would download their pnpm again under /root —
            # while moving HOME puts both parts on the volume whatever the rest
            # is: turbo passes HOME to its tasks and the kit to its children.
            # Nothing else here reads it to a different effect. pnpm 9.1.2's
            # `exec` and `run` do not open the store, so the store a new HOME
            # would point pnpm at is never compared with the one `verify`
            # installed `node_modules` from, and the kit's tests name their own
            # `--store-dir`. The secret tests set SOPS_AGE_KEY_FILE, so sops does
            # not look in the home directory for a key. node:22 ships no global
            # git configuration, so the new home lacks nothing /root had.
            # PostgreSQL and Redis are already up, as `postgres` and with their
            # own directories.
            - export HOME="$STEP_STATE/home"
            - mkdir -p "$HOME"
            - corepack enable

            # `--concurrency=1` is not a throttle to relax when a run feels slow.
            # The packages share one PostgreSQL and one Redis, and both turbo and
            # vitest would otherwise fan out across more workers than the machine
            # has cores; a run that starves itself times out before its
            # assertions get to run.
            #
            # Scoped exactly as `verify` scoped the build, computed again because
            # each step is its own container and shell.
            - FILTERS="$(node scripts/ci-scope.mjs filters)"

            # Boot examples/03-auth under `spfn dev` (issue #329). The example
            # declares no `"type": "module"`, which is the shape a scaffolded app
            # has and the one `spfn dev` once ran as CommonJS beside an ESM
            # server: two copies of @spfn/core, a boot the server now refuses.
            # Nothing else in CI runs `spfn dev`, so without this a dev runner
            # that splits the formats again stays green and only developers'
            # machines see the refusal. Here, not in `verify`, because the
            # example needs PostgreSQL; its own database, so the suites' are
            # untouched. Scoped like the 01 smoke: exit 1 is "not in scope".
            # Measured at about 20s, the migration included.
            - |
                IN_SCOPE=0
                node scripts/ci-scope.mjs includes 03-auth || IN_SCOPE=$?
                case "$IN_SCOPE" in
                    0) createdb -h 127.0.0.1 -U postgres spfn_smoke_dev_03
                       SMOKE_DATABASE_URL=postgres://postgres@127.0.0.1:5432/spfn_smoke_dev_03 node scripts/smoke-dev-example-03.mjs ;;
                    1) echo "smoke-dev-example-03: skipped, 03-auth is outside this pull request's scope" ;;
                    *) exit "$IN_SCOPE" ;;
                esac

            - pnpm exec turbo run test --concurrency=1 $FILTERS

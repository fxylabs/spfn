name: Verify mobile contract export

# The mobile contract bundle in contracts/mobile/ is generated from
# packages/auth/src/server/client-proof. spfn-mobile pins it by digest and
# claims upstream provenance, so what is committed here must be exactly what
# the exporter produces — this workflow is the evidence behind that claim.
#
# The `pull_request` trigger below never fires: pull requests are opened on
# Gitea and GitHub is a mirror. What runs is the main push, so this is evidence
# recorded after merge rather than a gate before it. Moving the check onto
# .woodpecker/pr.yml is worth doing; it is not done yet.

on:
  push:
    branches: [main, master]
    paths:
      - 'contracts/mobile/**'
      - 'packages/auth/src/server/client-proof/**'
      - 'packages/auth/scripts/export-mobile-contract.ts'
  pull_request:
    paths:
      - 'contracts/mobile/**'
      - 'packages/auth/src/server/client-proof/**'
      - 'packages/auth/scripts/export-mobile-contract.ts'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The conformance suites import @spfn/core subpaths, whose exports point at
      # dist/ — a fresh checkout has no dist, so the workspace deps must be built.
      # @spfn/auth is one of them: its own source imports itself by package name
      # (`@spfn/auth`, `@spfn/auth/errors`), and those resolve through the same
      # dist/ exports. Without it contract-export.test.ts fails at import with
      # "Failed to resolve entry for package @spfn/auth". Same order as the
      # publish workflow's build.
      - name: Build workspace dependencies the suites import
        run: pnpm --filter @spfn/core build && pnpm --filter @spfn/notification build && pnpm --filter @spfn/auth build

      - name: Regenerate the export
        run: pnpm --filter @spfn/auth export:mobile-contract

      - name: Fail if the committed export differs from what the exporter produces
        run: |
          if ! git diff --exit-code -- contracts/mobile/
          then
            echo "::error::contracts/mobile/ is not what the exporter produces."
            echo "Run: pnpm --filter @spfn/auth export:mobile-contract, then commit the result."
            exit 1
          fi

      - name: Contract export and conformance suites
        run: pnpm --filter @spfn/auth exec vitest run src/server/client-proof

      # 파일명은 contract-bundle.ts의 BUNDLE_FILENAME과 같아야 한다. 이름이 어긋나면
      # 조용히 빈 digest를 찍고 통과하지 않도록 pipefail로 실패하게 둔다.
      - name: Record the published digest
        run: |
          set -euo pipefail
          shasum -a 256 contracts/mobile/spfn-mobile-contract.json
          echo "commit  ${{ github.sha }}"

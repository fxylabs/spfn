# npmjs side of a @spfn/core release: publishes the tarball the Gitea registry
# already has for the version in packages/core/package.json. The steps are in
# publish-from-gitea.yml; this file keeps the package's own trigger and its
# workflow_dispatch backfill.
name: Publish @spfn/core

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/core/package.json'
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create git tag for this version'
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub release for this version'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (npm publish --dry-run, no dist-tag change)'
        type: boolean
        default: false

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-from-gitea.yml
    with:
      package_dir: packages/core
      create_tag: ${{ inputs.create_tag || false }}
      create_release: ${{ inputs.create_release || false }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GITEA_PACKAGES_READ_TOKEN: ${{ secrets.GITEA_PACKAGES_READ_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

# npmjs side of a @spfn/workflow release: publishes the tarball the Gitea registry
# already has for the version in packages/workflow/package.json. The steps are in
# publish-from-gitea.yml; this file keeps the package's own trigger and its
# workflow_dispatch backfill.
name: Publish @spfn/workflow

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/workflow/package.json'
  workflow_dispatch:
    inputs:
      create_tag:
        description: 'Create git tag for this version'
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub release for this version'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (npm publish --dry-run, no dist-tag change)'
        type: boolean
        default: false

# One run of this package at a time: npm dist-tags have no compare-and-swap,
# and the forward-only rule reads them before it writes, so two overlapping
# runs could leave a tag on the older version. `queue: max` keeps every waiting
# run (FIFO, up to 100); the default keeps only the newest and cancels the
# rest, and a cancelled run is a version that never reaches npmjs.
concurrency:
  group: publish-npmjs-packages/workflow
  queue: max

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-from-gitea.yml
    with:
      package_dir: packages/workflow
      create_tag: ${{ inputs.create_tag || false }}
      create_release: ${{ inputs.create_release || false }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      GITEA_PACKAGES_READ_TOKEN: ${{ secrets.GITEA_PACKAGES_READ_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
